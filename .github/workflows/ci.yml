name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Smart Contracts (Format + Lint + Test + WASM Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Rust Code Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Soroban Contract Unit Tests
        run: cargo test --workspace --verbose

      - name: Build WASM Release Artifacts
        run: |
          cargo build --target wasm32-unknown-unknown --release -p escrow-contract
          cargo build --target wasm32-unknown-unknown --release -p reputation-contract

      - name: Upload Contract WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-contract-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm

  frontend:
    name: Frontend (Lint + Vitest Unit Tests + Bundle Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm test -- --run

      - name: Build Vite Production Bundle
        run: npm run build

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
