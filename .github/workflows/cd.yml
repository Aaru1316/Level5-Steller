name: CD Continuous Deployment Pipeline

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'

jobs:
  deploy-check:
    name: Deployment Verification & Production Packaging
    runs-on: ubuntu-latest
    needs: [ci-validation]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Excel & Presentation Tools
        run: |
          python -m pip install openpyxl python-pptx

      - name: Verify Feedback Export Artifacts
        run: |
          python docs/generate_excel.py
          python docs/generate_pitch_deck.py

      - name: Upload Level 5 Deliverables Package
        uses: actions/upload-artifact@v4
        with:
          name: level5-blue-belt-package
          path: |
            docs/user-signups-export.xlsx
            docs/pitch-deck.pptx
            docs/PITCH_DECK.md

  ci-validation:
    name: Validate CI Status
    uses: ./.github/workflows/ci.yml
